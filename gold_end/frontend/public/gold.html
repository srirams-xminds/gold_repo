<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Market</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --text: #111827;
  --muted: #6B7280;
  --border: #E5E7EB;
  --blue: #2563EB;
  --card: #FFFFFF;
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  background: transparent;
  font-family: 'Inter', system-ui, sans-serif;
}

.container {
  width: 100%;
  height: 100%;
  background: var(--card);
  display: flex;
  flex-direction: column;
}

.header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  text-align: center;
  flex-shrink: 0;
}

.header h1 {
  margin: 0;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.3px;
}

.fx-tag {
  margin-top: 4px;
  font-size: 0.7rem;
  color: var(--muted);
}

.controls {
  padding: 8px 12px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.btn {
  border: 1px solid var(--border);
  background: #F9FAFB;
  padding: 5px 10px;
  cursor: pointer;
  border-radius: 6px;
  font-size: 0.65rem;
  font-weight: 600;
  margin: 0 3px;
  color: #374151;
  transition: all 0.2s;
}

.btn:hover {
  background: #F3F4F6;
}

.btn.active {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
}

.chart-wrapper {
  flex: 1;
  padding: 12px;
  position: relative;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.chart-container {
  flex: 1;
  position: relative;
  min-height: 0;
}

canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
}

.loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: var(--muted);
  font-size: 0.75rem;
}

.price-table {
  flex-shrink: 0;
  padding: 0 12px 12px;
  max-height: 140px;
  overflow-y: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  position: sticky;
  top: 0;
  background: #F9FAFB;
}

th, td {
  padding: 6px 8px;
  font-size: 0.65rem;
  border-bottom: 1px solid var(--border);
  color: #374151;
  text-align: left;
}

th {
  font-weight: 600;
}

.price-text {
  font-weight: 600;
  color: var(--text);
}
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <h1>Bangalore 24K Gold</h1>
    <div id="fx" class="fx-tag">Loading market data…</div>
  </div>

  <div class="controls" id="chartControls" style="display:none;">
    <button class="btn" onclick="filterChart(5, this)">5D</button>
    <button class="btn" onclick="filterChart(30, this)">1M</button>
    <button class="btn" onclick="filterChart(365, this)">1Y</button>
    <button class="btn" onclick="filterChart(0, this)">MAX</button>
  </div>

  <div class="chart-wrapper">
    <div id="loader" class="loading">Fetching Rates…</div>
    <div class="chart-container" id="chartContainer" style="display:none;">
      <canvas id="goldChart"></canvas>
    </div>
  </div>

  <div class="price-table" id="priceTable" style="display:none;">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Day</th>
          <th style="text-align: right;">₹ / gram</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
const GOLD_API = "https://freegoldapi.com/data/latest.json";
const FX_API = "https://api.fxratesapi.com/latest?base=USD";

const OZ_TO_G = 31.1034768;
const BENGALURU_24K_ADJUSTMENT = 1.0374;

let fullHistory = [];
let currentInrRate = 1;
let chartInstance = null;

async function updateRates() {
  try {
    const [gRes, fRes] = await Promise.all([
      fetch(GOLD_API),
      fetch(FX_API)
    ]);

    const gData = await gRes.json();
    const fData = await fRes.json();

    currentInrRate = fData.rates.INR;
    fullHistory = gData;

    const latest = calculateRetail(gData[gData.length - 1].price);

    window.parent.postMessage(
      { type: "GOLD_PRICE", price: latest },
      "*"
    );

    document.getElementById('fx').innerText =
      `1 USD = ₹${currentInrRate.toFixed(2)} | Bangalore Rates`;

    const tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = "";

    gData.slice(-5).reverse().forEach(item => {
      const day = new Date(item.date).toLocaleDateString('en-IN', { weekday: 'short' });
      const price = calculateRetail(item.price);

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${item.date}</td>
        <td>${day}</td>
        <td class="price-text" style="text-align: right;">₹${price.toLocaleString('en-IN')}</td>
      `;
      tableBody.appendChild(row);
    });

    document.getElementById('loader').style.display = 'none';
    document.getElementById('priceTable').style.display = 'block';
    document.getElementById('chartContainer').style.display = 'block';
    document.getElementById('chartControls').style.display = 'block';

    // Default open 5 Day chart
    const firstBtn = document.querySelector('.btn');
    filterChart(5, firstBtn);

  } catch (err) {
    console.error(err);
    document.getElementById('loader').innerText = "Unable to connect.";
  }
}

function calculateRetail(usdOz) {
  return Math.round(((usdOz * currentInrRate) / OZ_TO_G) * BENGALURU_24K_ADJUSTMENT);
}

function filterChart(days, btn) {
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const data = days === 0 ? fullHistory : fullHistory.slice(-days);
  renderChart(
    data.map(d => d.date),
    data.map(d => calculateRetail(d.price))
  );
}

function renderChart(labels, values) {
  const ctx = document.getElementById('goldChart');
  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: '#2563EB',
        backgroundColor: 'rgba(37,99,235,0.1)',
        fill: true,
        tension: 0.4,
        pointRadius: 0,
        pointHoverRadius: 6,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false,
      },
      plugins: { 
        legend: { display: false },
        tooltip: {
          enabled: true,
          mode: 'index',
          intersect: false,
          callbacks: {
            label: function(context) {
              return ' ₹' + context.parsed.y.toLocaleString('en-IN');
            }
          }
        }
      }
    }
  });
}

updateRates();
</script>
</body>
</html>
